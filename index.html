<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Downloader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Spotify Downloader</h1>
        <p class="subtitle">Masukkan link lagu Spotify untuk mengunduh</p>
        
        <div class="input-group">
            <input type="text" id="spotify-url" placeholder="https://open.spotify.com/track/..." autocomplete="off">
            <button id="search-btn">Cari Lagu</button>
        </div>
        
        <div id="loading" class="loading-state">
            <div class="spinner"></div>
            <span>Mencari data lagu, mohon tunggu...</span>
        </div>
        
        <div id="result-container" class="result-box"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
