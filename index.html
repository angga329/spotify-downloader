<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Spotify Downloader</title>

<style>
body {
    font-family: Arial;
    background: #121212;
    color: white;
    text-align: center;
    padding-top: 100px;
}

input {
    padding: 10px;
    width: 300px;
    border-radius: 8px;
    border: none;
}

button {
    padding: 10px 20px;
    background: #1DB954;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<h2>Spotify Downloader</h2>

<input type="text" id="url" placeholder="Paste link Spotify">
<br><br>
<button onclick="download()">Download</button>

<div id="result"></div>

<script>
async function download() {
    const url = document.getElementById("url").value

    const res = await fetch(`/api/download?url=${encodeURIComponent(url)}`)
    const data = await res.json()

    if (!data.status) {
        document.getElementById("result").innerHTML = "Gagal"
        return
    }

    document.getElementById("result").innerHTML = `
        <h3>${data.result.title}</h3>
        <p>${data.result.artist}</p>
        <a href="${data.result.download}" target="_blank">Download</a>
    `
}
</script>

</body>
</html>
